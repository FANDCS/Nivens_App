name: notes_app
description: Markdown notes app με πολυμέσα, ζωγραφική, sync και encryption
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Markdown / rich editing ---
  markdown: ^7.2.2
  flutter_markdown: ^0.7.4+1   # για το rendered Preview mode στον editor

  # --- Γραμματοσειρές ανά σημείωση ---
  # Κατεβάζει & cache-άρει τις γραμματοσειρές του Google Fonts (υποστηρίζουν
  # ελληνικό αλφάβητο). Δες lib/features/notes/note_fonts.dart
  google_fonts: ^6.2.1

  # --- Local DB (encrypted SQLite) ---
  drift: ^2.20.0
  sqlcipher_flutter_libs: ^0.6.4
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- Encryption ---
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2

  # --- Sync (raw REST προς Supabase/PocketBase/custom server, δες lib/core/sync/) ---
  http: ^1.2.2

  # --- About screen (άνοιγμα email/links) ---
  url_launcher: ^6.2.5

  # --- Πολυμέσα / ζωγραφική ---
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  scribble: ^0.10.0+1
  record: ^7.1.1

  # --- PDF ανάγνωση / προβολή ---
  # ΣΗΜΕΙΩΣΗ: τα δύο παρακάτω πακέτα Syncfusion ΠΡΕΠΕΙ να έχουν πάντα το
  # ΙΔΙΟ, ακριβές (χωρίς ^) version — μοιράζονται εσωτερικά το
  # syncfusion_flutter_core και pub αποτυγχάνει αν διαφέρουν.
  # Κρατάμε 31.2.18 (και όχι κάτι πιο πρόσφατο) επίτηδες: από την
  # 33.2.13+1 και μετά το syncfusion_flutter_pdfviewer απαιτεί
  # device_info_plus ^13.1.0 → win32 ^6.0.1, το οποίο συγκρούεται με το
  # flutter_secure_storage_windows (win32 ^5.x). Αν στο μέλλον το
  # flutter_secure_storage ανεβάσει το δικό του win32, μπορείς να
  # ανεβάσεις μαζί και τα δύο Syncfusion πακέτα.
  syncfusion_flutter_pdf: 31.2.18
  syncfusion_flutter_pdfviewer: 31.2.18
  syncfusion_flutter_core: 31.2.18

  # --- Άδειες αποθηκευτικού χώρου (για τον φάκελο Documents/Nivens) ---
  permission_handler: ^11.3.1

  # --- Sync (Supabase) ---
  supabase_flutter: ^2.6.0

  # --- Charts ---
  fl_chart: ^0.69.0

  # --- QR export ---
  qr_flutter: ^4.1.0

  # --- State / prefs ---
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2

  uuid: ^4.5.1
  yaml: ^3.1.2
  yaml_writer: ^2.1.0
  archive: ^4.0.7   # χρησιμοποιείται και για την ανάγνωση .docx (OOXML zip)

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true   # ενεργοποιεί auto-generation των ARB translations
